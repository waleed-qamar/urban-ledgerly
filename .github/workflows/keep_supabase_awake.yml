name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --max-time 15 \
            "${{ secrets.KEEPALIVE_URL }}"